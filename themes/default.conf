# themes/default.conf — barevné schéma pro fzf panely
# Používá standardní fzf --color syntax. Sourcováno jako proměnná prostředí
# FZF_DEFAULT_OPTS před spuštěním ui::fuzzy_pick, pokud THEME=default.

FZF_THEME_OPTS="--color=fg:#d0d0d0,bg:-1,hl:#5f87af \
--color=fg+:#d0d0d0,bg+:#262626,hl+:#5fd7ff \
--color=info:#afaf87,prompt:#d7005f,pointer:#af5fff \
--color=marker:#87ff00,spinner:#af5fff,header:#87afaf"
