# fzf-mc — hlavní konfigurace
# Zdrojováno jako bash. Řádky lze přepsat exportováním proměnných
# před spuštěním, nebo úpravou přímo zde.

# Výchozí cesty panelů při startu
LEFT_PATH=$HOME
RIGHT_PATH=/sdcard

# Externí editor pro F4 / otevření textových souborů
EDITOR=nano

# Program pro náhled souborů (F3). Doporučeno: bat (barevný diff/syntax highlight)
PREVIEW=bat

# true = mazání (F8) přesune do data/trash místo trvalého smazání
USE_TRASH=true

# Výchozí backend při startu bez profilu: local | ssh | rclone
DEFAULT_BACKEND=local

# Motiv v themes/ (bez přípony .conf)
THEME=default
